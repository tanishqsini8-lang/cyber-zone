name: Refresh Cyber Zone Jobs

on:
  schedule:
    - cron: '0 */6 * * *'      # every 6 hours
  workflow_dispatch:            # manual trigger

permissions:
  contents: write               # needed to commit jobs.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run fetcher
        env:
          ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD:  ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: python fetch_jobs.py

      - name: Commit updated jobs.json
        run: |
          git config user.name  "cyber-zone-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "chore: refresh jobs $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push